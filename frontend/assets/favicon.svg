<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="ashley-mark-title">
  <title id="ashley-mark-title">Ashley</title>
  <!--
    Ashley's mark is the asterisk: this app renders *actions* as stage
    directions, so it is the app's own signature rather than a decoration.
    Deliberately not FaultLine's turnstile.

    It carries its own tile so it reads on a light or a dark browser chrome
    without depending on prefers-color-scheme, which tab strips honour
    inconsistently. Three strokes and a dot, nothing thinner than 7 units at
    a 64 viewBox -- at 16px that is ~1.75 device pixels per stroke, about the
    floor for a shape that still resolves. The 1px inner border of the earlier
    version disappeared at that size and only added mud, so it is gone.

    An SVG loaded as an icon gets no stylesheet, so these colours are literals
    by necessity rather than by preference -- Ashley's Midnight palette (slab,
    ember, accent). They are the only raw colours in the frontend.
  -->
  <rect width="64" height="64" rx="14" fill="#14121f"/>
  <g stroke="#ff8a5b" stroke-width="7.5" stroke-linecap="round">
    <path d="M32 16.5v31"/>
    <path d="M18.6 24.25 45.4 39.75"/>
    <path d="M45.4 24.25 18.6 39.75"/>
  </g>
  <circle cx="32" cy="32" r="7" fill="#7455f5"/>
</svg>
